name: Auto Update BEBOX Playlist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Requests
        run: pip install requests

      - name: Run Script
        run: python update_list.py

      - name: Save Playlist
        run: |
          git config --global user.name "BeboxBot"
          git config --global user.email "bot@bebox.com"
          git add playlist.m3u
          git commit -m "Update Playlist" || exit 0
          git push
