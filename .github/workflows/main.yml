name: Update BeBox Playlist

on:
  schedule:
    # سيقوم السكربت بالعمل تلقائياً كل 24 ساعة (عند الساعة 12 منتصف الليل)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # يتيح لك تشغيل التحديث يدوياً بضغطة زر في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # ضروري جداً لكي يتمكن الأكشن من حفظ ملف playlist.m3u الجديد

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Update Script
        run: python update_list.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u
          git commit -m "Auto-update: Playlist updated with Fluxus & Kurdish sources" || echo "No changes to commit"
          git push
